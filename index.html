<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>MTEase</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #mteaseFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    id="mteaseFrame"
    src="https://script.google.com/macros/s/AKfycbzDd1-Q9eoqp56ZCnV72Efz0nsIKKEB6xSbOw6qukBKOsi4swsd8IFwDeluRXoaE57p1g/exec"
    title="MTEase Scanner"
    allow="camera; microphone; geolocation"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

</body>
</html>
