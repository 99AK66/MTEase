<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>MTEase</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzDd1-Q9eoqp56ZCnV72Efz0nsIKKEB6xSbOw6qukBKOsi4swsd8IFwDeluRXoaE57p1g/exec"
    allow="camera *; microphone *; geolocation *"
    allowfullscreen>
  </iframe>
</body>
</html>
